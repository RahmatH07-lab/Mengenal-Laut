
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Petualangan Laut Si Kiki 🌊 Hewan Laut untuk Anak-Anak</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json" />
    <style>
      body {
        font-family: 'Nunito', sans-serif;
      }
      .font-kids {
        font-family: 'Fredoka', 'Nunito', sans-serif;
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
      }
      @keyframes bubbleRise {
        0% { transform: translateY(100%) scale(0.6); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-120%) scale(1.1); opacity: 0; }
      }
      @keyframes swimAcross {
        0% { transform: translateX(-10%); }
        100% { transform: translateX(110%); }
      }
      @keyframes gentlePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes mouthTalk {
        0%, 100% { transform: scaleY(0.3); }
        50% { transform: scaleY(1.1); }
      }
      .animate-float {
        animation: floatSlow 4s ease-in-out infinite;
      }
      .animate-gentle-pulse {
        animation: gentlePulse 2s ease-in-out infinite;
      }
      .talking-mouth {
        animation: mouthTalk 0.22s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
